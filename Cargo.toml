[workspace]
resolver = "2"
members = ["libarchive", "jni", "vendor/sevenz-rust2"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/MaxrregMustermann/libarchive-rs"

[workspace.dependencies]
libarchive = { path = "libarchive" }
# Compression codecs. Every one of these is a pure-Rust or statically-linked C implementation with
# no runtime dependency on the platform, so the same code paths are used on the host and on Android.
brotli = { version = "9", default-features = false, features = ["std"] }
bzip2 = { version = "0.6", default-features = false }
crc32fast = "1.5"
deflate64 = "0.1"
# `rust_backend` (miniz_oxide) is what this line asks for, but it is inert in this graph: `unarc-rs`
# -> `zip` enables `flate2/zlib-rs`, Cargo unifies the features, and flate2's `ffi/mod.rs` compiles
# its miniz_oxide module only under `cfg(not(any_zlib))`, while `zlib-rs` enables `any_zlib`. The
# effective deflate backend is therefore zlib-rs, for reading and writing. This is a property of the
# feature graph, not a measurement: `cargo tree -p libarchive -e features` shows both features on
# flate2, and miniz_oxide is unreachable. Naming `zlib-rs` explicitly here would not change anything
# (zip still enables flate2's defaults) and would only risk dropping `runtime_detection` if it did.
# See libarchive/benches/zip.rs for the writer measurements.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "frame"] }
lzma-rust2 = { version = "0.21", features = ["std"] }
ppmd-rust = "1.5"
zstd = { version = "0.14", default-features = false }
aes = "0.9"
aes-gcm = "0.10"
# 0.11, not 0.10: `hmac`/`pbkdf2` 0.13 need `digest` 0.11, which `sha1` 0.10 does not speak, so
# the two cannot be combined. WinZip AES key derivation is PBKDF2-HMAC-SHA1 and is not negotiable
# about the hash, hence this version. (`zip` 8.6 in this same tree pins the identical stack.)
sha1 = "0.11"
hmac = "0.13"
pbkdf2 = "0.13"
# Reused wholesale for the long tail of legacy formats. See libarchive/src/lib.rs.
unarc-rs = { version = "0.7", default-features = false }
sevenz-rust2 = { path = "vendor/sevenz-rust2", default-features = false }

[profile.release]
# Decompression is the hot path and this crate exists to make archives open fast, so the trade is
# binary size for speed. Measured at around 13% on reading a deflate archive.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"