[package]
name = "libarchive"
description = "Streaming archive and compression reading and writing for Android file managers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "libarchive"
# `rlib` so the JNI crate and the tests can link it; `cdylib` is built by the `jni` crate.
crate-type = ["rlib"]

[dependencies]
brotli.workspace = true
bzip2.workspace = true
crc32fast.workspace = true
deflate64.workspace = true
flate2.workspace = true
lz4_flex.workspace = true
lzma-rust2.workspace = true
ppmd-rust.workspace = true
zstd.workspace = true
aes.workspace = true
aes-gcm.workspace = true
sha1.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
# The 7Z container. Vendored and patched: `vendor/sevenz-rust2/PATCHES.md` records every
# difference from upstream 0.23.0, which is one new file and three accessors. The file is a
# resumable folder cursor, without which a solid archive costs one decode per entry instead of one
# per archive.
#
# The feature set is the app's, deliberately and in full: `aes256` because an encrypted 7Z is
# ordinary, `bzip2` and `ppmd` because both appear in real archives. Turning any of them off would
# make this crate read fewer archives than the one it replaces, which is a regression dressed up as
# a saving.
sevenz-rust2 = { workspace = true, features = ["aes256", "bzip2", "compress", "ppmd", "util"] }
unarc-rs.workspace = true

[dev-dependencies]
sevenz-rust2 = { workspace = true, features = ["aes256", "bzip2", "compress", "ppmd", "util"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"
rand = "0.9"
tempfile = "3"
# The differential harness (tests/differential.rs). Three oracles, all offline:
# `unarc-rs` and `sevenz-rust2` are already regular dependencies; `oxiarc-archive` is the exact
# git revision the app pins (TheFileManager/app/src/main/rust/Cargo.toml:28), resolvable from the
# local cargo git cache.
oxiarc-archive = { git = "https://github.com/MaxrregMustermann/oxiarc", rev = "93b17af" }
# The corpus manifest, parsed with serde.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Generates the RAR corpus in examples/gen_corpus.rs, copying unarc-rs's own pattern
# (unarc-rs-0.7.2/tests/rar_decompression.rs:10-48). No `rar`/`unrar` CLI exists on this machine.
rars = "0.9"

[features]
default = []
# Reading the long tail: RAR, ARJ, ACE, ARC, Zoo, LZH, SQ, UCB, UC2, Ha, Hyp, Ice.
# On by default because a file manager that silently cannot open a `.rar` is broken.
legacy = []
# Formats that pull in extra dependencies and are almost never met.
exotic = []

[[bench]]
name = "zip"
harness = false

[[bench]]
name = "listing"
harness = false